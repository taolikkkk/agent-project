server:
  port: ${SERVER_PORT:8009}
  compression:
    enabled: true
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
spring:
  application:
    name: KnowEngine
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
  mvc:
    async:
      request-timeout: 600000
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/know_engine?rewriteBatchedStatements=true&useUnicode=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:lk020518}
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: ${DRUID_USERNAME:admin}
        login-password: ${DRUID_PASSWORD:admin}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:4}
  redis:
    redisson:
      config: |
        singleServerConfig:
          idleConnectionTimeout: 10000
          connectTimeout: 10000
          timeout: 3000
          retryAttempts: 3
          retryInterval: 1500
          subscriptionsPerConnection: 5
          clientName: null
          address: "redis://${REDIS_HOST:127.0.0.1}:${REDIS_PORT:6379}"
          subscriptionConnectionMinimumIdleSize: 1
          subscriptionConnectionPoolSize: 50
          connectionMinimumIdleSize: 24
          connectionPoolSize: 64
          database: ${REDIS_DATABASE:4}
          dnsMonitoringInterval: 5000
        threads: 16
        nettyThreads: 32
        codec: !<org.redisson.codec.JsonJacksonCodec> {}
        transportMode: "NIO"
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:/mapper/**/*.xml
llm:
  qwen:
    base-url: ${QWEN_BASE_URL:http://202.127.200.35:8081/v1}
    model: ${QWEN_MODEL:qwen3.8-27b}
    api-key: ${QWEN_API_KEY:local}
    connect-timeout: ${QWEN_CONNECT_TIMEOUT:30000}
    response-timeout: ${QWEN_RESPONSE_TIMEOUT:300000}
    temperature: ${QWEN_TEMPERATURE:0}
    # 最大生成 token 数，与上下文窗口不同；可按实际响应长度调整。
    max-tokens: ${QWEN_MAX_TOKENS:262144}
langchain4j:
  community:
    neo4j:
      await-index-timeout: 300
      auth:
        uri: ${NEO4J_URI:bolt://localhost:7687}
        user: ${NEO4J_USERNAME:neo4j}
        password: ${NEO4J_PASSWORD:}
elasticsearch:
  host: ${ELASTICSEARCH_URL:http://127.0.0.1:9200}
  base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  model-name: ${EMBEDDING_MODEL:text-embedding-v4}
  api-key: ${EMBEDDING_API_KEY:}
  dimensions: ${EMBEDDING_DIMENSIONS:1536}
minio:
  url: ${MINIO_URL:http://localhost:9000}
  endpoint: ${MINIO_URL:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}
  bucketName: ${MINIO_BUCKET:know-engine}
neo4j:
  uri: ${NEO4J_URI:bolt://localhost:7687}
  username: ${NEO4J_USERNAME:neo4j}
  password: ${NEO4J_PASSWORD:neo4j666}
file:
  parse:
    api:
      url: ${MINERU_URL:http://127.0.0.1:8000}
xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN_URL:http://127.0.0.1:8081}
    executor:
      # 未迁移 xxl-job-admin，保持关闭；需要调度时将 XXL_JOB_ENABLED 设为 true。
      enabled: ${XXL_JOB_ENABLED:false}
      appname: know-engine-executor
      accessToken: ${XXL_JOB_ACCESS_TOKEN:default_token}
      logpath: ./logs/xxl-job/jobhandler
      logretentiondays: 30
springdoc:
  group-configs:
    - group: know-engine
      packages-to-scan: cn.hollis.llm.mentor.know.engine
      paths-to-match: /**
knife4j:
  enable: true
  setting:
    language: zh_cn
sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  is-read-cookie: true
  is-read-header: true
qa-cache:
  enabled: ${QA_CACHE_ENABLED:false}
  index-name: know-engine-qa-cache-v1
  min-score: 0.95
  min-frequency: 3
  reviewer-ids: ${QA_CACHE_REVIEWER_IDS:}
